[package]
name = "jans-launcher"
version = "0.3.0"
edition = "2024"
default-run = "jans-launcher"
description = "One-click modpack updater and Minecraft launcher for Jan's Fabric pack"
license = "MIT"
repository = "https://github.com/bozmund/jans-launcher"
publish = false

[[bin]]
name = "jans-modpack-updater"
path = "src/updater_main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
directories = "6"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "clipboard", "links"] }
futures = "0.3"
globset = "0.4"
hex = "0.4"
md-5 = "0.10"
open = "5"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "stream", "form", "query"] }
rfd = "0.17"
rusqlite = { version = "0.41.1", features = ["bundled"] }
self-replace = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time", "io-std"] }
toml = "0.9"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_Console", "Win32_System_Threading"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
